[project]
name = "autonomous-sdr-backend"
version = "0.1.0"
description = "Multi-tenant Autonomous SDR platform — API + worker."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "psycopg[binary]>=3.1",
    "cryptography>=42",
    "openai>=1.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["api*", "tenancy*", "agents*", "ai*", "orchestrator*", "channels*", "rag*", "eval*", "db*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `param: T = Depends(...)` default-argument pattern is intentional,
# not the mutable-default-argument bug this rule otherwise catches correctly.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
